
name: Build Pelican Client

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip PelicanClient-Android-Fabric-1.21.11-Starter.zip -d source

      - name: Build Fabric mod
        working-directory: source/PelicanClient-Starter
        run: gradle :fabric-mod:build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Pelican-Client-JAR
          path: source/PelicanClient-Starter/fabric-mod/build/libs/*.jar
          if-no-files-found: error
